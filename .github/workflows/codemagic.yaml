workflows:
  android-apk-build:
    name: Build GhostStep APK
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      vars:
        JAVA_VERSION: "17"
      android: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
          source: true

    scripts:
      - name: Set up JDK
        script: |
          sdk install java $JAVA_VERSION
          sdk use java $JAVA_VERSION

      - name: Make Gradle executable
        script: chmod +x ./gradlew

      - name: Build Debug APK
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - name@example.com
